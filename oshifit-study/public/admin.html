<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OshiFit 開発者ページ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
:root{--bg:#f9f9ff;--card:#fff;--line:#e5e7eb;--fg:#141b2b;--muted:#424754;--primary:#0058be;--bad:#ba1a1a;--bad-bg:#ffdad6;--warn:#825100;--warn-bg:#ffddb8;--low:#f1f3ff}
@media (prefers-color-scheme:dark){:root{--bg:#0b1120;--card:#141b2b;--line:#2a3550;--fg:#edf0ff;--muted:#c2c6d6;--primary:#adc6ff;--bad:#ffb4ab;--bad-bg:#3d1515;--warn:#ffb95f;--warn-bg:#33230a;--low:#1a2234}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.7 "BIZ UDPGothic",sans-serif;padding:16px}
main{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
h1{font-size:22px;margin:0}h2{font-size:16px;margin:0 0 8px}
.btn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:8px 16px;font:inherit;font-weight:700;cursor:pointer}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.kpi b{display:block;font-size:26px}
.kpi span{font-size:12px;color:var(--muted)}
.alert{padding:8px 0;border-top:1px solid var(--line)}.alert:first-child{border-top:0}.alert.bad{color:var(--bad)}.alert.w{color:var(--warn)}
.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:760px;font-size:13px}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--low);color:var(--muted);font-size:12px}.mono{font-family:ui-monospace,Menlo,monospace}.muted{color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}input{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;min-width:260px;background:var(--card);color:var(--fg)}
</style>
<script src="config.js"></script>
<script src="settings.js"></script>
<script src="plans.js"></script>
</head><body><main id="app"><p class="muted">読み込んでいます…</p></main>
<script type="module">
// 開発者ページ（閲覧のみ）。admins/{メールアドレス} に登録した大学アカウントだけが全件を読める（firestore.rules）。
// CSV の形は DATA_SCHEMA_ja.md。参加者の実データをリポジトリに入れないこと。
const V = "10.14.1", CDN = (m) => `https://www.gstatic.com/firebasejs/${V}/firebase-${m}.js`;
const [{ initializeApp }, A, F] = await Promise.all([import(CDN("app")), import(CDN("auth")), import(CDN("firestore"))]);
const app = initializeApp(window.OSHIFIT_FIREBASE), auth = A.getAuth(app), db = F.getFirestore(app);
if (window.OSHIFIT_EMULATOR) { A.connectAuthEmulator(auth, window.OSHIFIT_EMULATOR.auth, { disableWarnings: true }); F.connectFirestoreEmulator(db, ...window.OSHIFIT_EMULATOR.firestore); }
const QN = await (await fetch("questionnaire.json")).json();
const $ = (s) => document.querySelector(s), el = $("#app"), DAY = 864e5;
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const ms = (t) => (t && t.toMillis ? t.toMillis() : null);
let PLANS = window.OSHIFIT_PLANS.map((p) => p.id);   // Firestore の plans で足した提案も、読み込んだあとに加える
const ST = window.OSHIFIT_SETTINGS;
let CFG = ST.apply({}).cfg, MG = { proto: null, ops: null, history: [], events: [], cfgRejected: [], plans: ST.mergePlans(window.OSHIFIT_PLANS, []).plans, planDocs: new Set(), planRejected: [], notices: [], notes: {} };
const SC = ["wb", "joy", "sleep", "money", "duty", "compare", "burnout", "who5raw", "shs", "pss"];
const items = (ids) => QN.sections.filter((s) => ids.includes(s.id)).flatMap((s) => s.items.map((i) => i.id));
const BASE_ITEMS = QN.sections.flatMap((s) => s.items.map((i) => i.id)).filter((id) => id !== "Q62");
const FINAL_ITEMS = [...items(["who5", "shs", "pss"]), "Q29", "Q30", "Q31", "Q32", "Q33", "Q34", "Q39", "Q44", "Q45", "Q46", "Q47", "Q48", "Q49", "Q50", "Q51", "J1", "J2", "K1", "K2", "K3", "K4", "K5"];

const ERR = { "auth/operation-not-allowed": "このログイン方法が Firebase で有効になっていません（Authentication →「ログイン方法」で有効にしてください）", "auth/popup-blocked": "ポップアップが止められました。このサイトのポップアップを許可してください", "auth/popup-closed-by-user": "ログインの画面が閉じられました", "auth/unauthorized-domain": "このドメインが Firebase の「承認済みドメイン」にありません", "auth/account-exists-with-different-credential": "このメールアドレスは別のログイン方法で登録済みです", "auth/invalid-action-code": "ログイン用のリンクが古いか、使用済みです。もう一度送ってください" };
const errMsg = (e) => (ERR[e && e.code] || "ログインできませんでした") + `（${e && e.code}）`;
function login() {
  el.innerHTML = `<section class="card"><h1>開発者ページ</h1><p class="muted">登録した大学アカウントでログインしてください（閲覧のみ）。</p>
   <div class="row"><button class="btn primary" id="g">Google でログイン</button><button class="btn primary" id="ms">Microsoft（大学のアカウント）でログイン</button></div>
   <div class="row" style="margin-top:10px"><input id="mail" type="email" placeholder="大学のメールアドレス"><button class="btn" id="m">ログイン用のリンクを送る</button></div><p id="msg" class="muted"></p></section>`;
  $("#g").onclick = () => A.signInWithPopup(auth, new A.GoogleAuthProvider()).catch((e) => ($("#msg").textContent = errMsg(e)));
  $("#ms").onclick = () => { const p = new A.OAuthProvider("microsoft.com"); p.setCustomParameters({ prompt: "select_account", ...(window.OSHIFIT_MS_TENANT ? { tenant: window.OSHIFIT_MS_TENANT } : {}) }); A.signInWithPopup(auth, p).catch((e) => ($("#msg").textContent = errMsg(e))); };
  $("#m").onclick = async () => {
    const mail = $("#mail").value.trim(); if (!mail) return;
    try { await A.sendSignInLinkToEmail(auth, mail, { url: location.href, handleCodeInApp: true }); localStorage.setItem("oshifit.adminMail", mail); $("#msg").textContent = "メールを送りました。届いたリンクをこの端末で開いてください。"; }
    catch (e) { $("#msg").textContent = errMsg(e); }
  };
}
if (A.isSignInWithEmailLink(auth, location.href)) {
  const mail = localStorage.getItem("oshifit.adminMail") || prompt("ログインに使ったメールアドレスを入力してください");
  await A.signInWithEmailLink(auth, mail, location.href).catch((e) => console.error(e));
  history.replaceState(null, "", location.pathname);
}

A.onAuthStateChanged(auth, async (u) => {
  if (!u || u.isAnonymous) return login();
  try { const me = await F.getDoc(F.doc(db, "admins", u.email)); if (!me.exists()) throw new Error("not admin"); }
  catch (e) { el.innerHTML = `<section class="card"><h1>開発者ページ</h1><p>このアカウント（${esc(u.email || "メールアドレスなし")}）には閲覧の権限がありません。</p><p class="muted" style="font-size:12px">Firestore の admins に、このメールアドレスと同じ名前のドキュメントがあるか確認してください（大文字・小文字も同じにします）。</p><button class="btn" id="out">ログアウト</button></section>`; $("#out").onclick = () => A.signOut(auth); return; }
  el.innerHTML = `<p class="muted">データを読み込んでいます…</p>`;
  const [ps, cks, pil, dly, cf, pl, nt, nn] = await Promise.all([F.getDocs(F.collection(db, "participants")), F.getDocs(F.collectionGroup(db, "checkins")), F.getDocs(F.collection(db, "pilots")), F.getDocs(F.collectionGroup(db, "daily")),
    F.getDoc(F.doc(db, "study", "protocol")), F.getDocs(F.collection(db, "plans")), F.getDocs(F.collection(db, "notices")), F.getDocs(F.collection(db, "notes"))]);
  const [hs, ev, op] = await Promise.all([F.getDocs(F.collection(db, "study", "protocol", "history")), F.getDocs(F.collection(db, "study", "protocol", "events")), F.getDoc(F.doc(db, "ops", "alerts"))]);
  MG.proto = cf.exists() ? cf.data() : null; MG.ops = op.exists() ? op.data() : null;
  MG.history = hs.docs.map((d) => d.data()).sort((a, b) => a.version - b.version); MG.events = ev.docs.map((d) => d.data()).sort((a, b) => (ms(a.at) || 0) - (ms(b.at) || 0));
  const ap = ST.apply(MG.proto || {}, MG.ops || {}); CFG = ap.cfg; MG.cfgRejected = ap.rejected; MG.planDocs = new Set(pl.docs.map((d) => d.id));
  const mp = ST.mergePlans(window.OSHIFIT_PLANS, pl.docs.map((d) => ({ ...d.data(), id: d.id }))); MG.plans = mp.plans; MG.planRejected = mp.rejected; PLANS = MG.plans.map((p) => p.id);
  MG.notices = nt.docs.map((d) => ({ ...d.data(), id: d.id })); MG.notes = Object.fromEntries(nn.docs.map((d) => [d.id, d.data()]));
  const dByUid = {}; dly.docs.forEach((c) => { const uid = c.ref.parent.parent.id; (dByUid[uid] = dByUid[uid] || []).push(c.data()); });
  const pilots = new Set(pil.docs.map((d) => d.id));
  const P = ps.docs.map((d) => ({ uid: d.id, ...d.data() }));
  const byUid = {}; cks.docs.forEach((c) => { const uid = c.ref.parent.parent.id; (byUid[uid] = byUid[uid] || []).push(c.data()); });
  P.forEach((p) => { p.cks = (byUid[p.uid] || []).sort((a, b) => a.week - b.week); p.daily = (dByUid[p.uid] || []).sort((a, b) => a.day - b.day); p.pilot = pilots.has(p.pid) ? 1 : 0; p.note = MG.notes[p.pid] || null; });
  render(u, P);
});

function alerts(P) {
  const out = [], now = Date.now();
  for (const p of P) {
    const dec = ms(p.decidedAt);
    if (dec && !p.withdrawn && (p.group === "B" || p.group === "C") && !p.final && p.cks.length < CFG.nChecks) {
      const last = p.cks.length ? Math.max(...p.cks.map((c) => ms(c.at) || 0)) : dec;
      const gap = Math.floor((now - last) / DAY);
      if (gap >= CFG.alerts.noCheckDays) out.push(["bad", `${p.pid}：振り返りが${CFG.alerts.noCheckDays}日以上ない（${gap}日。開始から${Math.floor((now - dec) / DAY)}日目・${p.cks.length}回済み）`]);
    }
    if (dec && !p.withdrawn && !p.final) { const lastD = p.daily.length ? Math.max(...p.daily.map((x) => ms(x.at) || 0)) : dec; const gapD = Math.floor((now - lastD) / DAY); if (gapD >= CFG.alerts.noDailyDays) out.push(["w", `${p.pid}：毎日のアンケートが${gapD}日ない（記録 ${p.daily.length}日）`]); }
    const w0 = p.scores && p.scores.who5raw; if (w0 != null && w0 <= CFG.alerts.who5Max) out.push(["bad", `${p.pid}：開始時のWHO-5が${w0}点（${CFG.alerts.who5Max}点以下）`]);
    const c3 = p.cks.find((c) => c.week === 3); if (c3 && c3.W1 != null) { const r = ["W1", "W2", "W3", "W4", "W5"].reduce((a, k) => a + (c3[k] ?? 0), 0); if (r <= CFG.alerts.who5Max) out.push(["bad", `${p.pid}：3回目のWHO-5が${r}点（${CFG.alerts.who5Max}点以下）`]); }
    const wf = p.final && p.final.scores && p.final.scores.who5raw; if (wf != null && wf <= CFG.alerts.who5Max) out.push(["bad", `${p.pid}：最後の調査のWHO-5が${wf}点（${CFG.alerts.who5Max}点以下）`]);
    if (p.answers && p.answers.Q42 != null && p.answers.Q42 !== 2) out.push(["w", `${p.pid}：注意確認（Q42）の誤答`]);
  }
  return out;
}

function render(u, P) {
  const al = alerts(P), cnt = (f) => P.filter(f).length, d = (t) => (ms(t) ? new Date(ms(t)).toLocaleDateString("ja-JP") : "–");
  const k = [["同意して開始", P.length], ["質問紙を完了", cnt((p) => p.baselineDone)], ["群A（順調）", cnt((p) => p.group === "A")], ["群B（プランB）", cnt((p) => p.group === "B")], ["群C（プランA）", cnt((p) => p.group === "C")], ["最後の調査まで完了", cnt((p) => p.final)], ["注意確認の誤答", cnt((p) => p.answers && p.answers.Q42 != null && p.answers.Q42 !== 2)], ["プレ実験の参加者", cnt((p) => p.pilot)], ["参加をやめた人", cnt((p) => p.withdrawn)]];
  el.innerHTML = `<div class="row" style="justify-content:space-between"><div><h1>開発者ページ</h1><p class="muted">${esc(u.email)} でログイン中。参加者の回答は閲覧のみ（書き換え・削除はできません）。実験の条件・提案・運用の値・お知らせ・メモは下の「設定と管理」で管理します</p></div><button class="btn" id="out">ログアウト</button></div>
   <section class="kpis">${k.map(([l, v]) => `<div class="card kpi"><span>${l}</span><b>${v}</b></div>`).join("")}</section>
   <section class="card"><h2>確認が必要（${al.length}件）</h2>${al.length ? al.map(([c, t]) => `<div class="alert ${c}">${esc(t)}</div>`).join("") : '<p class="muted">ありません</p>'}
    <p class="muted" style="font-size:12px">連絡先は集めていないため、相談先の表示はアプリが自動で行います。</p></section>
   ${extractHTML(P)}
   <section class="card"><div class="row" style="justify-content:space-between"><h2>参加者（${P.length}人）</h2><div class="row">
     <button class="btn primary" id="zip-all">分析用にまとめて書き出す（ZIP）</button><button class="btn" data-csv="baseline">開始時（baseline.csv）</button><button class="btn" data-csv="weekly">振り返りごと（weekly.csv）</button><button class="btn" data-csv="trial">最後の調査まで（trial.csv）</button><button class="btn" data-csv="daily">毎日（daily.csv）</button><button class="btn" data-csv="free">自由記述（free.csv）</button></div></div>
    <div class="tablewrap"><table><thead><tr><th>参加ID</th><th>開始日</th><th>群</th><th>提案</th><th>振り返り</th><th>開始からの日数</th><th>WHO-5 開始→最後</th><th>プレ実験</th><th>設定の版</th><th>メモ</th></tr></thead><tbody>
    ${P.map((p) => { const dec = ms(p.decidedAt); return `<tr><td class="mono">${esc(p.pid)}</td><td>${d(p.createdAt)}</td><td>${p.group ? "群" + p.group : "未決定"}${p.withdrawn ? "（やめた）" : ""}</td><td>${esc((p.planIds || []).join("・") || "–")}</td><td>${p.group === "A" ? "–" : p.cks.length + " / " + CFG.nChecks}</td><td>${dec ? Math.floor((Date.now() - dec) / DAY) + "日目" : "–"}</td><td>${p.scores?.who5raw ?? "–"} → ${p.final?.scores?.who5raw ?? "–"}</td><td>${p.pilot ? "はい" : ""}</td><td>${p.cfgVersion ?? "–"}</td><td>${p.note?.exclude ? '<b style="color:#b3261e">分析から除外</b> ' : ""}${esc(p.note?.text || "")} <button class="btn" data-note="${esc(p.pid)}" style="padding:2px 8px">メモ</button></td></tr>`; }).join("")}
    </tbody></table></div></section>
   ${manageHTML()}`;
  $("#out").onclick = () => A.signOut(auth);
  el.querySelectorAll("[data-note]").forEach((b) => (b.onclick = () => editNote(b.dataset.note, u)));
  el.querySelectorAll("[data-seed]").forEach((b) => (b.onclick = () => seed(b.dataset.seed, u)));
  el.querySelectorAll("[data-plan]").forEach((b) => (b.onclick = () => togglePlan(b.dataset.plan, u)));
  const on = (id, f) => { const x = $("#" + id); if (x) x.onclick = f; };
  on("pr-create", () => saveProto(u, true)); on("pr-save", () => saveProto(u, false)); on("pr-lock", () => lockProto(u, true)); on("pr-unlock", () => lockProto(u, false)); on("op-save", () => saveOps(u));
  el.querySelectorAll("[data-csv]").forEach((b) => (b.onclick = () => download(b.dataset.csv, P)));
  $("#zip-all").onclick = () => downloadZip(P);
  wireExtract(P);
}

// ---------- データを選んで書き出す（種類・期間・参加者・群・除外を選び、表示中の行だけを CSV に保存）
const KINDS = { daily: "毎日のアンケート（daily）", weekly: "振り返り（weekly）", baseline: "開始時（baseline）", trial: "最後の調査（trial）", free: "自由記述（free）" };
// 行の日付（日本時間の YYYY-MM-DD）。毎日のアンケートは端末の日付（date）、ほかは記録の時刻から
const jstDay = (isoStr) => { if (!isoStr) return ""; const t = Date.parse(isoStr); return isNaN(t) ? "" : new Date(t + 9 * 3600e3).toISOString().slice(0, 10); };
const jstTime = (isoStr) => { if (!isoStr) return ""; const t = Date.parse(isoStr); return isNaN(t) ? "" : new Date(t + 9 * 3600e3).toISOString().slice(0, 19).replace("T", " "); };
function rowDay(kind, r, P) {
  if (kind === "daily") return r.date || jstDay(r.at);
  if (kind === "weekly") return jstDay(r.at);
  if (kind === "baseline") return jstDay(r.created_at);
  if (kind === "trial") return jstDay(r.final_at);
  const p = P.find((x) => x.pid === r.pid); return p ? jstDay(iso(p.createdAt)) : "";   // free：その人の開始日
}
function extract(P, f) {
  const [rows, cols] = tables(P)[f.kind];
  const byPid = Object.fromEntries(P.map((p) => [p.pid, p]));
  const out = rows.filter((r) => {
    const p = byPid[r.pid] || {}, day = rowDay(f.kind, r, P);
    if (f.from && (!day || day < f.from)) return false;
    if (f.to && (!day || day > f.to)) return false;
    if (f.pid && r.pid !== f.pid) return false;
    if (f.group && p.group !== f.group) return false;
    if (!f.excluded && p.note?.exclude) return false;
    return true;
  }).map((r) => ({ ...r, _day: rowDay(f.kind, r, P) })).sort((a, b) => (a._day < b._day ? 1 : a._day > b._day ? -1 : 0));
  return { rows: out, cols, total: rows.length };
}
function extractHTML(P) {
  const pids = [...new Set(P.map((p) => p.pid))].sort();
  return `<section class="card" id="extract"><h2>データを選んで書き出す</h2>
   <div class="row" style="align-items:flex-end">
    <label style="display:flex;flex-direction:column;font-size:12px">データ<select id="ex-kind">${Object.entries(KINDS).map(([k, l]) => `<option value="${k}">${l}</option>`).join("")}</select></label>
    <label style="display:flex;flex-direction:column;font-size:12px">開始日<input type="date" id="ex-from" style="min-width:0"></label>
    <label style="display:flex;flex-direction:column;font-size:12px">終了日<input type="date" id="ex-to" style="min-width:0"></label>
    <label style="display:flex;flex-direction:column;font-size:12px">研究用の番号<select id="ex-pid"><option value="">すべて</option>${pids.map((x) => `<option>${esc(x)}</option>`).join("")}</select></label>
    <label style="display:flex;flex-direction:column;font-size:12px">群<select id="ex-group"><option value="">すべて</option><option>A</option><option>B</option><option>C</option></select></label>
    <label style="font-size:12px;display:flex;gap:6px;align-items:center"><input type="checkbox" id="ex-excl" checked style="min-width:0">分析から除外した人も含める</label>
    <button class="btn primary" id="ex-show">表示</button><button class="btn" id="ex-csv">表示中のデータを CSV 保存</button></div>
   <p class="muted" id="ex-count" style="margin:4px 0">条件を選んで「表示」を押してください（日付は日本時間。毎日のアンケートは回答した日、振り返り・最後の調査は記録の時刻、開始時と自由記述は開始した日）。</p>
   <div class="tablewrap" id="ex-table"></div></section>`;
}
function readExtract() {
  return { kind: $("#ex-kind").value, from: $("#ex-from").value, to: $("#ex-to").value, pid: $("#ex-pid").value, group: $("#ex-group").value, excluded: $("#ex-excl").checked };
}
const PREVIEW_COLS = { daily: ["pid", "group", "date", "day", "mood", "yen", "minutes", "joy", "Q44", "Q45", "Q47", "Q48"], weekly: ["pid", "group", "week", "day", "at", "stress", "happy", "dBurn", "dMood", "dExec", "sumYen", "sumMin", "W1"],
  baseline: ["pid", "group", "exclude", "created_at", "decided_at", "plans_chosen", "wb", "burnout", "pss", "cfg_version"], trial: ["pid", "group", "final_day", "final_at", "wb_post", "burnout_post", "pss_post", "exec_rate", "total_yen"], free: ["pid", "where", "text"] };
let EX = null;
function wireExtract(P) {
  if (!$("#ex-show")) return;
  const show = () => {
    const f = readExtract();
    if (f.from && f.to && f.from > f.to) { $("#ex-count").textContent = "開始日が終了日より後になっています。"; return; }

// ---------- 分析用にまとめて書き出す（ZIP）：5つの CSV と書き出しの記録を1つのファイルに。
// そのまま python -m analysis.run --data <この ZIP> に渡せる（展開しなくてよい）。ZIP は無圧縮（store）で、外部のライブラリを使わない
const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();

    const nm = enc.encode(name), data = enc.encode(text), crc = crc32(data);

    h.setUint16(10, dosT, true); h.setUint16(12, dosD, true); h.setUint32(14, crc, true); h.setUint32(18, data.length, true); h.setUint32(22, data.length, true); h.setUint16(26, nm.length, true); h.setUint16(28, 0, true);
    parts.push(new Uint8Array(h.buffer), nm, data);
    const c = new DataView(new ArrayBuffer(46)); c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(10, 0, true);
    c.setUint16(12, dosT, true); c.setUint16(14, dosD, true); c.setUint32(16, crc, true); c.setUint32(20, data.length, true); c.setUint32(24, data.length, true); c.setUint16(28, nm.length, true); c.setUint32(42, off, true);
    central.push(new Uint8Array(c.buffer), nm); off += 30 + nm.length + data.length;
  }

  e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true); e.setUint32(12, size, true); e.setUint32(16, off, true);

function exportFiles(P) {

    `書き出した日時：${now.toISOString()}（${now.toLocaleString("ja-JP")}）`,
    `参加者：${P.length}人（開始時の質問を終えた人 ${n("baseline")}人）`,
    `baseline.csv ${n("baseline")}行／weekly.csv ${n("weekly")}行／daily.csv ${n("daily")}行／trial.csv ${n("trial")}行／free.csv ${n("free")}行。config.json（使った設定）・plans.json（提案の一覧）`,
    `分析から除外（notes の exclude）：${P.filter((p) => p.note?.exclude).length}人`,
    "列の意味：oshifit-study/DATA_SCHEMA_ja.md",
    "分析：python -m analysis.run --data <この ZIP> --out <結果のフォルダ>（ZIP のまま渡せる）",
    "注意：参加者の実データです。リポジトリにコミットしない。free.csv（自由記述）は個人が特定される内容がないか確認してから使う。",

function downloadZip(P) {
