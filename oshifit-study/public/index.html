<title>OshiFit 画面試作</title>

<style>
/* OshiFit 研究版の画面試作。色は DESIGN.md（Modern Engineering System）に統一。
   決まり：青＝良い・利点、赤＝負担・欠点。角丸は部品8px・カード12px・状態表示だけ丸型。影は低く、1pxの線で区切る。 */
:root{
  --bg:#f9f9ff; --card:#ffffff; --low:#f1f3ff; --cont:#e9edff; --high:#e1e8fd; --line:#e5e7eb; --line2:#c2c6d6;
  --fg:#141b2b; --muted:#424754; --faint:#727785;
  --primary:#0058be; --primary-c:#2170e4; --primary-h:#004395; --primary-fx:#d8e2ff; --on-primary:#ffffff;
  --good:#0058be; --good-bg:#e9edff; --bad:#ba1a1a; --bad-bg:#ffdad6; --bad-fg:#93000a;
  --ok:#006c49; --ok-bg:#dcf7eb; --warn:#825100; --warn-bg:#ffddb8;
  --ink:#0f172a; --ink-line:#1e293b; --ink-fg:#e2e8f0; --ink-muted:#94a3b8;
  --inverse:#293040; --inverse-fg:#edf0ff; --scrim:rgba(15,23,42,.55);
  --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow-up:0 10px 15px -3px rgba(0,0,0,.08),0 4px 6px -2px rgba(0,0,0,.04);
  --sans:"Inter","BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif;
  --head:"Inter","Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:8px; --r-lg:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1120; --card:#141b2b; --low:#1a2234; --cont:#222c42; --high:#2a3550; --line:#2a3550; --line2:#3a4664;
  --fg:#edf0ff; --muted:#c2c6d6; --faint:#8b91a5;
  --primary:#adc6ff; --primary-c:#7aa4f5; --primary-h:#d8e2ff; --primary-fx:#0f2a57; --on-primary:#001a42;
  --good:#adc6ff; --good-bg:#132a52; --bad:#ffb4ab; --bad-bg:#3d1515; --bad-fg:#ffdad6;
  --ok:#4edea3; --ok-bg:#0d2a1f; --warn:#ffb95f; --warn-bg:#33230a;
  --ink:#060a14; --ink-line:#1e293b; --ink-fg:#e2e8f0; --ink-muted:#94a3b8;
  --inverse:#dce2f7; --inverse-fg:#141b2b; --scrim:rgba(0,0,0,.65);
  --shadow:none; --shadow-up:0 10px 24px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1120; --card:#141b2b; --low:#1a2234; --cont:#222c42; --high:#2a3550; --line:#2a3550; --line2:#3a4664;
  --fg:#edf0ff; --muted:#c2c6d6; --faint:#8b91a5;
  --primary:#adc6ff; --primary-c:#7aa4f5; --primary-h:#d8e2ff; --primary-fx:#0f2a57; --on-primary:#001a42;
  --good:#adc6ff; --good-bg:#132a52; --bad:#ffb4ab; --bad-bg:#3d1515; --bad-fg:#ffdad6;
  --ok:#4edea3; --ok-bg:#0d2a1f; --warn:#ffb95f; --warn-bg:#33230a;
  --ink:#060a14; --ink-line:#1e293b; --ink-fg:#e2e8f0; --ink-muted:#94a3b8;
  --inverse:#dce2f7; --inverse-fg:#141b2b; --scrim:rgba(0,0,0,.65);
  --shadow:none; --shadow-up:0 10px 24px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{margin:0;font:400 15px/1.7 var(--sans);-webkit-font-smoothing:antialiased;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
.app{max-width:480px;margin:0 auto}
.app.wide{max-width:1200px}
h1,h2,h3{font-family:var(--head);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(24px,6.4vw,30px);font-weight:800;line-height:1.3}
h2{font-size:20px;font-weight:700;line-height:1.4}
h3{font-size:15px;font-weight:700;line-height:1.5}
p{margin:0}
button{font:inherit;color:inherit}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center}
.row>*{min-width:0}
.muted{color:var(--muted)} .small{font-size:13px} .xs{font-size:12px;line-height:1.6}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-family:var(--sans);font-variant-numeric:tabular-nums;font-weight:700}
/* 上部バー */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:color-mix(in srgb,var(--card) 92%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .in{max-width:480px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:36px}
.wide .top .in{max-width:1200px}
.logo{display:inline-flex;align-items:center;gap:8px;font:800 18px var(--head);letter-spacing:-.02em;cursor:pointer;user-select:none;background:none;border:0;padding:0}
.logo i{width:4px;height:18px;border-radius:2px;background:var(--primary);box-shadow:0 0 10px color-mix(in srgb,var(--primary) 55%,transparent)}
.tag{font:600 11px var(--sans);color:var(--muted);background:var(--low);border:1px solid var(--line);border-radius:6px;padding:1px 7px}
.ctx{font:600 12px var(--sans);color:var(--primary);background:var(--good-bg);border-radius:999px;padding:3px 10px;white-space:nowrap}
/* 編集者モード（研究者・確認用） */
.editbar{max-width:480px;margin:8px auto 0;display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:center;padding:6px;border-radius:var(--r-lg);background:var(--warn-bg);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent)}
.wide .editbar{max-width:1200px}
.editbar select,.editbar button{appearance:none;border:1px solid color-mix(in srgb,var(--warn) 25%,transparent);background:var(--card);color:var(--fg);border-radius:var(--r);min-height:34px;padding:4px 10px;font:600 12.5px var(--sans);cursor:pointer;min-width:0}
.editbar .tools{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.editbar .tools span{font:600 11.5px var(--sans);margin-right:auto}
/* 進み具合 */
.stepper{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stepper li{display:flex;flex-direction:column;gap:5px;font:600 11px var(--sans);color:var(--faint)}
.stepper li::before{content:"";height:4px;border-radius:2px;background:var(--line)}
.stepper li.done{color:var(--fg)} .stepper li.done::before{background:var(--fg)}
.stepper li.now{color:var(--primary)} .stepper li.now::before{background:var(--primary)}
/* 面 */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}
.sunk{background:var(--low);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px}
.callout{border-radius:var(--r-lg);padding:12px 14px;font-size:13px;line-height:1.7;border:1px solid var(--line);background:var(--low)}
.callout.good{background:var(--good-bg);border-color:color-mix(in srgb,var(--good) 30%,transparent)}
.callout.bad{background:var(--bad-bg);border-color:color-mix(in srgb,var(--bad) 35%,transparent);color:var(--bad-fg)}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font:600 12px var(--sans);background:var(--low);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.chip.wrap{white-space:normal;line-height:1.5;padding-block:3px}
.chip.good{background:var(--good-bg);color:var(--good);border-color:transparent}
.chip.bad{background:var(--bad-bg);color:var(--bad-fg);border-color:transparent}
.chip.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.sec{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-bottom:10px;border-bottom:1px solid var(--line)}
/* ボタン */
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:50px;padding:10px 18px;border-radius:var(--r);border:1px solid var(--line);background:var(--card);font:600 15px var(--sans);cursor:pointer;transition:background .15s,border-color .15s;text-decoration:none;color:var(--fg)}
.btn:hover{border-color:var(--line2);background:var(--low)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.primary:hover{background:var(--primary-h);border-color:var(--primary-h)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:var(--card)}
.btn.danger-o{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,transparent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:6px 12px;font-size:13px}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid color-mix(in srgb,var(--primary) 40%,transparent);outline-offset:2px}
.dock{position:sticky;bottom:0;z-index:6;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:color-mix(in srgb,var(--card) 94%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(16,20,46,.05)}
.dock .in{max-width:480px;margin:0 auto;display:flex;gap:8px}
.dock .in>.btn{flex:2}.dock .in>.btn.back{flex:1}
.dock .note{max-width:480px;margin:6px auto 0;text-align:center;font-size:11.5px;color:var(--muted)}
/* 下のタブ */
.tabbar{position:sticky;bottom:0;z-index:6;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:4px max(16px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:color-mix(in srgb,var(--card) 94%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);margin-top:20px}
.tabbar .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{appearance:none;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font:600 11px var(--sans);color:var(--faint);cursor:pointer;border-radius:var(--r);min-height:48px;text-decoration:none}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--primary)}
/* 質問（1問ずつ・選ぶと次へ） */
.qprog{display:flex;flex-direction:column;gap:6px}
.qprog .meta{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;color:var(--muted)}
.bar{height:6px;border-radius:999px;background:var(--cont);overflow:hidden}
.bar i{display:block;height:100%;background:var(--primary);border-radius:999px;transition:width .35s ease}
.qcard{min-height:330px}
.qcard .ans{display:flex;flex-direction:column;gap:6px}
.qhead{display:flex;flex-direction:column;gap:8px;min-height:var(--qh,120px)}
.qcard.in{animation:slidein .28s cubic-bezier(.16,1,.3,1)}
.qcard.back{animation:slideback .28s cubic-bezier(.16,1,.3,1)}
@keyframes slidein{from{opacity:.35}to{opacity:1}}
@keyframes slideback{from{opacity:.35}to{opacity:1}}
.qid{font:600 12px var(--mono);color:var(--primary);background:var(--good-bg);border-radius:6px;padding:1px 8px}
.qtext{font:700 18px/1.55 var(--head);letter-spacing:-.01em}
.lead{font-size:12px;line-height:1.6;color:var(--muted)}
.circles{position:relative;display:flex;justify-content:space-between;align-items:center;padding:14px 2px}
.circles::before{content:"";position:absolute;left:16px;right:16px;top:50%;height:2px;background:var(--line);transform:translateY(-50%)}
.cbtn{position:relative;z-index:1;appearance:none;border-radius:50%;border:2px solid var(--line2);background:var(--card);cursor:pointer;display:grid;place-items:center;font:700 13px var(--sans);color:var(--muted);transition:transform .15s,background .15s,border-color .15s;padding:0}
.cbtn:hover{border-color:var(--primary);transform:scale(1.06)}
.cbtn[aria-checked="true"]{background:var(--primary);border-color:var(--primary);color:var(--on-primary);box-shadow:0 0 0 5px color-mix(in srgb,var(--primary) 18%,transparent)}
.ends{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--muted)}
.ends span:last-child{text-align:right}
.chosen{min-height:22px;text-align:center;font-size:13px;font-weight:600;color:var(--primary)}
.olist{display:flex;flex-direction:column;gap:8px}
.obtn{appearance:none;display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:48px;padding:10px 14px;border-radius:var(--r-lg);border:1px solid var(--line);background:var(--card);cursor:pointer;font:500 14px var(--sans);color:var(--fg);transition:border-color .15s,background .15s}
.obtn:hover{border-color:var(--line2);background:var(--low)}
.obtn .dot{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center}
.obtn .n{flex:none;font:600 12px var(--mono);color:var(--faint);width:18px;text-align:center}
.obtn[aria-checked="true"]{border-color:var(--primary);background:var(--good-bg);font-weight:700}
.obtn[aria-checked="true"] .dot{border-color:var(--primary);background:var(--primary);box-shadow:inset 0 0 0 3px var(--card)}
.field{width:100%;font:16px var(--sans);padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);color:var(--fg)}
textarea.field{min-height:120px;resize:vertical}
/* はじめ：ペンライトの帯 */
.lights{background:var(--ink);border:1px solid var(--ink-line);border-radius:var(--r-lg);padding:16px 14px 12px;color:var(--ink-fg)}
.lights .sticks{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;height:118px;align-items:end}
.stick{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%;font-size:11px;color:var(--ink-muted)}
.stick b{display:block;width:10px;border-radius:5px 5px 2px 2px;height:var(--h);background:var(--c);box-shadow:0 0 14px 1px var(--c);transform-origin:bottom;animation:rise .9s cubic-bezier(.2,.9,.2,1) both;animation-delay:var(--d)}
@keyframes rise{from{transform:scaleY(.1);opacity:.3}to{transform:none;opacity:1}}
.flow{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.flow li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.flow .no{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:700 12px var(--mono);background:var(--low);border:1px solid var(--line)}
.flow li:first-child .no{background:var(--fg);color:var(--card);border-color:var(--fg)}
.facts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--muted)}
.facts li{display:grid;grid-template-columns:18px 1fr;gap:8px}
.facts li::before{content:"";width:6px;height:6px;margin:8px 0 0 6px;border-radius:50%;background:var(--primary)}
.consent{display:flex;gap:12px;align-items:center;font-weight:700;font-size:14px;cursor:pointer}
.consent.card{flex-direction:row}
.consent input{width:20px;height:20px;accent-color:var(--primary)}
/* 分析 */
.axes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ax{border:1px solid var(--line);border-radius:var(--r-lg);padding:10px 12px;background:var(--card);display:flex;flex-direction:column;gap:6px}
.ax .h{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12.5px;font-weight:700}
.ax .v{font:800 26px/1 var(--sans);font-variant-numeric:tabular-nums}
.ax .v small{font-size:12px;font-weight:500;color:var(--faint)}
.ax.good .v{color:var(--good)} .ax.bad .v{color:var(--bad)}
.track{height:6px;border-radius:999px;background:var(--cont);overflow:hidden}
.track i{display:block;height:100%;border-radius:999px;background:currentColor}
.ax.good .track{color:var(--good)} .ax.bad .track{color:var(--bad)}
.trait{display:grid;grid-template-columns:6.5em 1fr 2.4em;gap:10px;align-items:center;font-size:13px}
.trait .track{color:var(--primary-c)}
details{border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font-weight:700;font-size:14px}
.formula{display:grid;gap:4px;margin-top:8px;font-size:12.5px;color:var(--muted)}
/* 2つの未来 */
.segs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;background:var(--cont);border-radius:var(--r-lg)}
.seg{appearance:none;border:0;background:transparent;border-radius:var(--r);padding:8px 4px;font:600 13px var(--sans);color:var(--muted);cursor:pointer;min-height:40px}
.seg[aria-pressed="true"]{background:var(--card);color:var(--fg);box-shadow:var(--shadow)}
.plan{border-left:3px solid var(--primary)}
.why{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.futures{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fut{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--card);padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.fut.b{border:2px solid var(--primary)}
.fut .lab{font:700 12px var(--sans);border-radius:6px;padding:2px 10px;background:var(--low);color:var(--muted);width:100%}
.fut.b .lab{background:var(--primary);color:var(--on-primary)}
.fut svg{max-width:100%;height:auto}
.pred{display:grid;gap:14px}
.pred .h{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;font-weight:700}
.pred .vals{font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap}

/* 予測：プランA＝今のまま（現在の得点）、プランB＝プランの軸が eff 点改善し、幸福度は改善の1/4だけ上がる（仮定 v1.0）
   80%の幅：各軸 ±15、幸福度 ±12（開始時。研究では実測から推定し直す） */
function predictMulti(sc,ids){let B={...sc};const ps=ids.map(planById);
  ps.forEach(p=>{B[p.axis]=clamp(B[p.axis]+p.eff,0,100); if(p.axis!=="wb") B.wb=clamp(B.wb+p.eff/4,0,100);
    if(p.axis!=="joy"&&p.axis!=="wb") B.burnout=clamp(B.burnout-p.eff/4,0,100); else B.joy=clamp(B.joy+p.eff,0,100);});
  if(sc.pss!=null&&sc.burnout!=null) B.pss=clamp(sc.pss*(1+(B.burnout-sc.burnout)/Math.max(sc.burnout,1)*.25),0,56); // 仮定：推し疲れの変化の1/4の割合でPSS-Jも動く
  return{A:sc,B,hw:15+5*(ids.length-1),hwWb:12+4*(ids.length-1),plans:ps};}

  if(p.axis!=="joy"&&p.axis!=="wb") B.burnout=clamp(sc.burnout-p.eff/4,0,100); else B.joy=clamp(sc.joy+p.eff,0,100);

const ISO_C=Math.cos(Math.PI/6);
function isoKit(u,ox,oy){
  const P=(x,y,z=0)=>[ox+(x-y)*ISO_C*u, oy+(x+y)*.5*u-z*u];
  const f=n=>n.toFixed(1), pts=a=>a.map(p=>P(...p).map(f).join(",")).join(" ");
  const out=[], add=s=>out.push(s);
  const poly=(a,fill,extra="")=>add(`<polygon points="${pts(a)}" fill="${fill}" ${extra}/>`);
  const K={P,add,poly,u,
    box(x,y,z,w,d,h,c={}){
      poly([[x,y+d,z],[x+w,y+d,z],[x+w,y+d,z+h],[x,y+d,z+h]],c.left||"var(--il-shade)");
      poly([[x+w,y,z],[x+w,y+d,z],[x+w,y+d,z+h],[x+w,y,z+h]],c.right||"var(--il-white)");
      poly([[x,y,z+h],[x+w,y,z+h],[x+w,y+d,z+h],[x,y+d,z+h]],c.top||"var(--il-white)")},
    onX(X,y,z,dy,dz,fill,extra){poly([[X,y,z],[X,y+dy,z],[X,y+dy,z+dz],[X,y,z+dz]],fill,extra)},
    onY(Y,x,z,dx,dz,fill,extra){poly([[x,Y,z],[x+dx,Y,z],[x+dx,Y,z+dz],[x,Y,z+dz]],fill,extra)},
    flat(x,y,z,w,d,fill,extra){poly([[x,y,z],[x+w,y,z],[x+w,y+d,z],[x,y+d,z]],fill,extra)},
    roof(x,y,z,w,d,h,fill){poly([[x,y+d/2,z+h],[x+w,y+d/2,z+h],[x+w,y+d,z],[x,y+d,z]],fill);poly([[x+w,y,z],[x+w,y+d,z],[x+w,y+d/2,z+h]],"var(--il-white)")},
    pyramid(x,y,z,w,d,h,fill){const c=[x+w/2,y+d/2,z+h];poly([[x,y+d,z],[x+w,y+d,z],c],fill);poly([[x+w,y,z],[x+w,y+d,z],c],"var(--il-shade)")},
    shapeY(Y,cx,cz,xy,fill,extra){poly(xy.map(([a,b])=>[cx+a,Y,cz+b]),fill,extra)},
    shapeX(X,cy,cz,yz,fill,extra){poly(yz.map(([a,b])=>[X,cy+a,cz+b]),fill,extra)},
    tree(x,y,s=1,fill="var(--il-green)"){const[a,b]=P(x,y,0),[c,d]=P(x,y,2.2*s);
      add(`<rect x="${f(a-.22*u)}" y="${f(d)}" width="${f(.44*u)}" height="${f(b-d)}" rx="2" fill="var(--il-trunk)"/><ellipse cx="${f(c)}" cy="${f(d-.9*s*u)}" rx="${f(1.15*s*u)}" ry="${f(1.35*s*u)}" fill="${fill}"/>`)},

    person(x,y,z,shirt,stick,flip,sit){const[a,b]=P(x,y,z),k=u/12,s=flip?-1:1,h=sit?16:24;
      add(`<g transform="translate(${f(a)} ${f(b)}) scale(${f(k*s)} ${f(k)})">`+
        (stick?`<g class="stick"><line x1="5" y1="${-h+2}" x2="11" y2="${-h-12}" stroke="${stick}" stroke-width="7" opacity=".28" stroke-linecap="round"/><line x1="5" y1="${-h+2}" x2="11" y2="${-h-12}" stroke="${stick}" stroke-width="3.2" stroke-linecap="round"/></g>`:"")+
        `<path d="M-6 0 V${-h+8} Q-6 ${-h} 0 ${-h} Q6 ${-h} 6 ${-h+8} V0Z" fill="${shirt}"/>${stick?`<path d="M3 ${-h+6} L6 ${-h+1}" fill="none" stroke-width="2.4" stroke-linecap="round"/>`:""}<circle cx="0" cy="${-h-6}" r="5.6" fill="var(--il-skin)"/><path d="M-5.6 ${-h-7} Q0 ${-h-15} 5.6 ${-h-7}Z" fill="var(--il-hair)"/></g>`)},

        <g transform="translate(16 -34)"><rect x="0" y="-11" rx="10" height="21" width="${label.length*12+16}" fill="var(--il-white)"/><text x="8" y="4" font-size="12" font-weight="700" fill="var(--il-ink)" stroke="none">${label}</text></g></g></g>`)},
    heartY(Y,cx,cz,s,fill){const xy=[];for(let i=0;i<40;i++){const t=i/40*2*Math.PI;xy.push([s*16*Math.sin(t)**3/16,s*(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))/16])}K.shapeY(Y,cx,cz,xy,fill)},

    svg(vb,cls,label){return`<svg viewBox="${vb}" class="${cls}" role="img" aria-label="${label}" stroke="var(--il-line)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">${out.join("")}</svg>`}};
  return K}

/* レーダーは幸福度とストレスを決める5つの要素。幸福度・ストレス度は結果として下の横棒で示す */
const FACTORS=()=>SC.axes.filter(a=>a.key!=="wb");const FV=sc=>FACTORS().map(a=>sc[a.key]),FN=()=>FACTORS().map(a=>a.name);
const pss100=sc=>sc.pss==null?null:sc.pss/56*100;
function outBars(rows,labels){
  const one=(v,good,i)=>`<div class="ob-row"><span class="xs muted">${labels[i]}</span><div class="ob"><i style="width:${clamp(v,0,100)}%;background:${good?"var(--good)":"var(--bad)"};opacity:${i===0&&labels.length>1?.4:1}"></i></div><b class="ob-v">${r0(v)}</b></div>`;
  return`<div class="outbars"><div class="ob-flow" aria-hidden="true"><span>5つの要素</span><svg viewBox="0 0 40 12" width="40" height="12"><path d="M2 6h32M28 1l6 5-6 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>幸福度とストレス度</span></div>${rows.filter(r=>r[1].every(v=>v!=null)).map(([n,vals,good,ref,desc])=>`<div class="ob-item"><div class="row" style="justify-content:space-between"><b class="small">${n}</b></div>
   <div class="ob-wrap">${vals.map((v,i)=>one(v,good,i)).join("")}${ref!=null?`<span class="ob-ref" style="left:calc(5.4em + 8px + (100% - 7.8em - 16px) * ${ref/100})"></span>`:""}</div></div>`).join("")}</div>`}
function radar(series,labels){const W=320,H=300,cx=160,cy=150,R=100,n=labels.length,ang=i=>-Math.PI/2+i*2*Math.PI/n,pt=(i,v)=>[cx+Math.cos(ang(i))*R*v/100,cy+Math.sin(ang(i))*R*v/100];
  const ring=v=>Array.from({length:n},(_,i)=>pt(i,v).join(",")).join(" ");
  let g=[20,40,80,100].map(v=>`<polygon points="${ring(v)}" fill="none" stroke="var(--line)"/>`).join("")+`<polygon points="${ring(60)}" fill="none" stroke="var(--primary)" stroke-dasharray="3 3" opacity=".6"/>`;
  g+=Array.from({length:n},(_,i)=>{const[x,y]=pt(i,100);return`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)"/>`}).join("");
  series.forEach(s=>{g+=`<polygon points="${s.v.map((v,i)=>pt(i,v).join(",")).join(" ")}" fill="${s.fill}" fill-opacity="${s.op??.12}" stroke="${s.stroke}" stroke-width="2" ${s.dash?'stroke-dasharray="4 3"':""}/>`;
    if(s.dots)g+=s.v.map((v,i)=>{const[x,y]=pt(i,v);return`<circle cx="${x}" cy="${y}" r="4" fill="${v>=60?"var(--good)":"var(--bad)"}" stroke="var(--card)" stroke-width="1.5"/>`}).join("")});
  const main=series[series.length-1].v;
  g+=labels.map((l,i)=>{const[x,y]=pt(i,124),a=Math.abs(x-cx)<5?"middle":x>cx?"start":"end";return`<text x="${x}" y="${y-2}" text-anchor="${a}" font-size="11" font-weight="700" fill="var(--fg)">${esc(l)}</text><text x="${x}" y="${y+12}" text-anchor="${a}" font-size="11" font-weight="700" fill="${main[i]>=60?"var(--good)":"var(--bad)"}">${r0(main[i])}</text>`}).join("");

function allowed(v){if(!STUDY)return v;
  if(S.withdrawn)return v==="start"?v:"withdrawn";
  if(v==="withdrawn")return S.consented?allowed("home"):"start";
  if(v==="admin"){location.href="admin.html";return"start"}
  if(!S.consented)return["start","signup","login"].includes(v)?v:"start";
  if(v==="login"||v==="signup")return allowed("home");   // ログイン済みなら、いま進むべき画面へ
  if(!S.baselineDone)return v==="start"?v:"q";
